<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>NeuralAdaptive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #0c0c10;
            color: #e0e0e0;
            padding: 16px;
            font-size: 13px;
        }

        h2 {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 16px;
            letter-spacing: 0.04em;
        }

        .score-block {
            margin-bottom: 16px;
        }

        .score-num {
            font-size: 52px;
            font-weight: 200;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .tier-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            margin-top: 8px;
        }

        .meter-track {
            height: 4px;
            background: #1e1e28;
            border-radius: 2px;
            margin: 12px 0;
            overflow: hidden;
        }

        .meter-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.8s ease, background 0.5s ease;
        }

        .signals {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 16px 0;
        }

        .sig-card {
            background: #131318;
            border-radius: 6px;
            padding: 8px;
            border: 0.5px solid #222;
        }

        .sig-label {
            font-size: 10px;
            color: #666;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .sig-value {
            font-size: 18px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
        }

        .sig-bar {
            height: 2px;
            background: #1e1e28;
            border-radius: 1px;
            margin-top: 6px;
            overflow: hidden;
        }

        .sig-bar-fill {
            height: 100%;
            border-radius: 1px;
            transition: width 0.6s ease;
        }

        .status-line {
            font-size: 11px;
            color: #444;
            margin-bottom: 16px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #444;
            margin-right: 6px;
            transition: background 0.3s;
        }

        .status-dot.live {
            background: #4ade80;
            box-shadow: 0 0 4px #4ade8066;
        }

        button {
            width: 100%;
            padding: 9px;
            background: #131318;
            border: 0.5px solid #2a2a35;
            color: #aaa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 6px;
            letter-spacing: 0.03em;
        }

        button:hover {
            background: #1a1a24;
            color: #ddd;
        }

        .signal-legend {
            font-size: 10px;
            color: #444;
            line-height: 1.8;
            margin-top: 16px;
            border-top: 0.5px solid #1a1a1a;
            padding-top: 12px;
        }

        .signal-legend span {
            color: #666;
        }
    </style>
</head>

<body>
    <h2>NEURAL ADAPTIVE</h2>

    <div style="display:flex;align-items:center;gap:6px;margin-bottom:16px;">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-line" id="status-text">Waiting for eye tracking...</span>
    </div>

    <div class="score-block">
        <div class="score-num" id="score-num" style="color:#4ade80">—</div>
        <div class="tier-badge" id="tier-badge" style="background:#1a2a1a;color:#4ade80">NO DATA</div>
        <div class="meter-track">
            <div class="meter-fill" id="meter-fill" style="width:0%;background:#4ade80"></div>
        </div>
    </div>

    <div class="signals">
        <div class="sig-card">
            <div class="sig-label">Fixation</div>
            <div class="sig-value" id="sig-fix" style="color:#4ade80">—</div>
            <div class="sig-bar">
                <div class="sig-bar-fill" id="bar-fix" style="width:0%;background:#4ade80"></div>
            </div>
        </div>
        <div class="sig-card">
            <div class="sig-label">Saccade</div>
            <div class="sig-value" id="sig-sacc" style="color:#facc15">—</div>
            <div class="sig-bar">
                <div class="sig-bar-fill" id="bar-sacc" style="width:0%;background:#facc15"></div>
            </div>
        </div>
        <div class="sig-card">
            <div class="sig-label">Regression</div>
            <div class="sig-value" id="sig-reg" style="color:#f87171">—</div>
            <div class="sig-bar">
                <div class="sig-bar-fill" id="bar-reg" style="width:0%;background:#f87171"></div>
            </div>
        </div>
    </div>

    <div class="signal-legend">
        <span>Fixation</span> — staring at one spot too long<br>
        <span>Saccade</span> — eyes jumping erratically<br>
        <span>Regression</span> — reading backwards (re-reading)
    </div>

    <script>
        var tierColors = {
            CALM: { score: '#4ade80', bg: '#1a2a1a', meter: '#4ade80' },
            ELEVATED: { score: '#facc15', bg: '#2a2a0a', meter: '#facc15' },
            OVERLOAD: { score: '#f87171', bg: '#2a0a0a', meter: '#f87171' },
        }

        setInterval(async function () {
            var data = await chrome.storage.local.get(['currentScore', 'currentTier', 'signals', 'lastUpdated'])
            if (data.currentScore == null) return

            var age = Date.now() - (data.lastUpdated || 0)
            var live = age < 5000
            document.getElementById('status-dot').className = 'status-dot' + (live ? ' live' : '')
            document.getElementById('status-text').textContent = live ? 'Eye tracking live' : 'Last update ' + Math.round(age / 1000) + 's ago'

            var score = data.currentScore
            var tier = data.currentTier || 'CALM'
            var colors = tierColors[tier] || tierColors.CALM

            document.getElementById('score-num').textContent = score.toFixed(2)
            document.getElementById('score-num').style.color = colors.score
            document.getElementById('meter-fill').style.width = (score * 100) + '%'
            document.getElementById('meter-fill').style.background = colors.meter

            var badge = document.getElementById('tier-badge')
            badge.textContent = tier
            badge.style.color = colors.score
            badge.style.background = colors.bg

            if (data.signals) {
                var s = data.signals
                document.getElementById('sig-fix').textContent = s.fixation.toFixed(2)
                document.getElementById('sig-sacc').textContent = s.saccade.toFixed(2)
                document.getElementById('sig-reg').textContent = s.regression.toFixed(2)
                document.getElementById('bar-fix').style.width = (s.fixation * 100) + '%'
                document.getElementById('bar-sacc').style.width = (s.saccade * 100) + '%'
                document.getElementById('bar-reg').style.width = (s.regression * 100) + '%'
            }
        }, 1000)
    </script>
</body>

</html>
