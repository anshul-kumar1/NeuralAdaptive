<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NeuralAdaptive Offscreen</title>
  </head>
  <body>
    <video
      id="webcam-feed"
      autoplay
      muted
      playsinline
      style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"
    ></video>

    <canvas
      id="pose-canvas"
      width="640"
      height="480"
      style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"
    ></canvas>

    <div
      id="debug-status"
      style="font-family:monospace;font-size:12px;padding:8px;background:#111;color:#0f0;position:fixed;top:0;left:0;width:100%;z-index:9999;"
    >
      Waiting for START_CAMERA...
    </div>

    <script src="lib/pose.js"></script>
    <script src="lib/camera_utils.js"></script>
    <script src="offscreen.js"></script>
  </body>
</html>
